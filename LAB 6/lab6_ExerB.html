<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="utf-8">
     <title>Grade Calculator</title>

<!-- Part 2: Link external CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
	<h1>Student Grade Calculator</h1>
</header>
<!-- Error 1 (Line 9): Missing return keyword -->
<!-- Wrong: <form name="gradeForm" onsubmit="checkMark()"> -->
<form name="gradeForm" onsubmit="return checkMark()">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br>

    <label for="mark">Mark (0-100):</label>
    <input type="text" id="mark" name="mark"><br>

    <button type="submit">Check Grade</button>

    <!-- Part 2: Add Random Mark button -->
    <button type="button" onclick="randomMark()">
        Random Mark
    </button>

</form>

<p id="result"></p>

<!-- Part 2: Display date and time -->
<p id="checkTime"></p>

<!-- Error 2 (Line 17): Incorrect function name -->
<!-- Wrong: <button onclick="showtable()">Show Grade Table</button> -->
<button onclick="showTable()">Show Grade Table</button>

<div id="tableContainer"></div>

<!-- Error 3 (Line 19): Incorrect JavaScript filename -->
<!-- Wrong: <script src="grades.js"></script> -->
<script src="grade.js"></script>
</body>
</html>
